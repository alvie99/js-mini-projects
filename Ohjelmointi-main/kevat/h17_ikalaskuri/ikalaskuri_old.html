<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="ikalaskuriStyles.css" />
    <script src="ikalaskuri_old.js" defer></script>
    <title>Age Calculator | Old Version</title>

    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="../kevat.html">&#8592; Takaisin harjoituksiin</a></li>
        <li><a href="../../index.html">&#8592; Takaisin etusivulle</a></li>
        <li>
          <a href="ikalaskuri.html">Open Improved Version</a>
        </li>
      </ul>
    </nav>

    <main id="main">
      <h1 class="versionTitle">Old Version</h1>
      <section class="ageCalculator" aria-label="Age calculator old version">
        <form id="ageForm" novalidate>
          <div class="inputRow">
            <figure class="field">
              <label for="day">Day</label>
              <input
                type="text"
                id="day"
                name="day"
                placeholder="DD"
                maxlength="2"
                inputmode="numeric"
              />
            </figure>

            <figure class="field">
              <label for="month">Month</label>
              <input
                type="text"
                id="month"
                name="month"
                placeholder="MM"
                maxlength="2"
                inputmode="numeric"
              />
            </figure>

            <figure class="field">
              <label for="year">Year</label>
              <input
                type="text"
                id="year"
                name="year"
                placeholder="YYYY"
                maxlength="4"
                inputmode="numeric"
              />
            </figure>
          </div>

          <div class="divider">
            <button type="submit" id="button" aria-label="Calculate age">
              &darr;
            </button>
          </div>
        </form>

        <div id="output" aria-live="polite">
          <p><span id="years">--</span> years</p>
          <p><span id="months">--</span> months</p>
          <p><span id="days">--</span> days</p>
        </div>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Ivan Astashov</a>.
    </footer>
  </body>
</html>
